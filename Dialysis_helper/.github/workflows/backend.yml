name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi.yaml"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: clave-solo-para-ci
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Estilo
        run: ruff check . && ruff format --check .
      - name: Migraciones al dia
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: pytest
      - name: El contrato OpenAPI esta actualizado
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml
          diff /tmp/openapi.yaml ../docs/openapi.yaml
