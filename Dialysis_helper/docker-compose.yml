services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dphogar
      POSTGRES_USER: dphogar
      POSTGRES_PASSWORD: dphogar_dev
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dphogar -d dphogar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  dbdata:
